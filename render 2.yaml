# Render Blueprint: public read-only demo (replay only, no API keys needed)
services:
  - type: web
    name: package-trail
    runtime: python
    plan: free
    buildCommand: "echo no build step, stdlib only"
    startCommand: "python3 -m app.server"
    healthCheckPath: /api/state
    envVars:
      - { key: PUBLIC_MODE, value: "1" }
      - { key: HOST, value: "0.0.0.0" }
      - { key: DATA_SOURCE, value: csv }
      - { key: DATA_DIR, value: data/public }
      - { key: PYTHON_VERSION, value: "3.11.9" }
